name: Update and publish Map
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: map-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh sanitized biome snapshot
        run: python sync_biomes.py
      - name: Save updated snapshot
        run: |
          if ! git diff --quiet -- biomes.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add biomes.json
            git commit -m 'Refresh coarse biome snapshot'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare public assets
        run: |
          mkdir -p public
          cp index.html style.css app.js biomes.json public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
